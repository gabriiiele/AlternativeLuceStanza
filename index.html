<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Luce Stanza</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <button id="btnOpen">Apri foto</button>
  <input id="file" type="file" accept="image/*" hidden>
  <span class="spacer"></span>
  <button id="btnUndo" disabled>↶</button>
  <button id="btnRedo" disabled>↷</button>
  <button id="btnCompare" disabled>Prima/Dopo</button>
  <button id="btnExport" class="primary" disabled>Esporta</button>
</header>

<main id="stage">
  <canvas id="view"></canvas>
  <div id="empty">Apri una foto per iniziare</div>
</main>

<nav id="tabs"></nav>
<section id="panel"></section>

<script src="app.js"></script>
</body>
</html>
