<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1a1a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Luce Stanza">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Luce Stanza</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css?v=17">
</head>
<body data-theme="dark">
<input id="file" type="file" accept="image/*,.heic,.heif,.dng,.cr2,.cr3,.crw,.nef,.nrw,.arw,.srf,.sr2,.raf,.orf,.rw2,.pef,.srw,.3fr,.iiq,.x3f,.erf,.kdc,.mrw,.dcr,.mos,.rwl" multiple hidden>
<input id="fileLut" type="file" accept=".cube" hidden>
<input id="filePreset" type="file" accept=".xmp,.lrtemplate,.json" multiple hidden>
<input id="fileWm" type="file" accept="image/*" hidden>
<input id="fileBackup" type="file" accept=".zip,application/zip" multiple hidden>

<!-- Libreria -->
<div id="libraryView" class="view">
  <header id="libTop" class="topbar"></header>
  <div id="libStatus" class="status" hidden></div>
  <main id="libBody"></main>
  <div id="selBar" class="selbar" hidden></div>
  <button id="fab" class="fab" title="Importa foto">＋</button>
  <nav id="libNav" class="bottomnav"></nav>
</div>

<!-- Editor -->
<div id="editorView" class="view" hidden>
  <header class="topbar edbar">
    <button id="btnBack" class="ibtn" title="Libreria" aria-label="Libreria"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span id="edTitle" class="title"></span>
    <button id="btnUndo" class="ibtn" title="Annulla" aria-label="Annulla" disabled><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button id="btnRedo" class="ibtn" title="Ripeti" aria-label="Ripeti" disabled><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14l5-5-5-5M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    <button id="btnReset" class="ibtn" title="Ripristina tutto" aria-label="Ripristina tutto" disabled><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v6h6M4.5 15a8 8 0 1 0 1.9-8.3L4 10"/></svg></button>
    <button id="btnExport" class="ibtn" title="Salva copia sul dispositivo" aria-label="Esporta" disabled><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 20h14"/></svg></button>
    <button id="btnMenu" class="ibtn" title="Menu" aria-label="Menu"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5h.01M12 12h.01M12 19h.01"/></svg></button>
  </header>
  <main id="stage">
    <canvas id="view"></canvas>
    <canvas id="ov"></canvas>
    <canvas id="hist" width="120" height="56" hidden></canvas>
    <div id="infoOv" hidden></div>
    <div id="empty"></div>
  </main>
  <section id="panel" class="sheet" hidden></section>
  <nav id="tabs" class="subtabs"></nav>
  <nav id="tools" class="toolbar"></nav>
</div>
<div id="toast" hidden></div>

<script src="compat.js?v=17"></script>
<script src="native.js?v=17"></script>
<script src="shaders.js?v=17"></script>
<script src="engine.js?v=17"></script>
<script src="profiles.js?v=17"></script>
<script src="presets.js?v=17"></script>
<script src="state.js?v=17"></script>
<script src="db.js?v=17"></script>
<script src="tools.js?v=17"></script>
<script src="export.js?v=17"></script>
<script src="ai.js?v=17"></script>
<script src="backup.js?v=17"></script>
<script src="merge.js?v=17"></script>
<script src="camera.js?v=17"></script>
<script src="app.js?v=17"></script>
<script src="library.js?v=17"></script>
</body>
</html>
